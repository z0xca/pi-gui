name: Update package

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-package
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Update pi-gui
        id: update
        run: |
          nix run nixpkgs#nix-update -- pi-gui --flake --version=stable
          if git diff --quiet -- package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^[[:space:]]*version = "\(.*\)";/\1/p' package.nix | head -n 1)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, and push
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "pi-gui: update to ${VERSION}"
          git tag "nix-v${VERSION}"
          git push origin main
          git push origin "nix-v${VERSION}"
